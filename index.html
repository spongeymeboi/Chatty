<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Instant Chat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- ============================= -->
    <!-- SIDEBAR -->
    <!-- ============================= -->

    <aside class="sidebar">

      <div class="brand">

        <div class="logo">#</div>

        <div>
          <strong>Instant Chat</strong>
          <small>IRC // realtime</small>
        </div>

      </div>


      <button
        id="newRoom"
        class="new-room"
        type="button"
      >
        ＋ New room
      </button>


      <div class="section-title">
        CHANNELS
      </div>


      <div
        id="rooms"
        class="rooms"
      ></div>


      <!-- PROFILE -->

      <div class="profile">

        <div
          id="avatar"
          class="avatar"
        >
          ?
        </div>


        <div class="profile-name">

          <strong id="myName">
            Connecting…
          </strong>

          <small>
            <span class="status-dot"></span>
            online
          </small>

        </div>


        <button
          id="changeNick"
          type="button"
          title="Change nickname"
        >
          ⚙
        </button>

      </div>

    </aside>


    <!-- ============================= -->
    <!-- MAIN CHAT -->
    <!-- ============================= -->

    <main class="main">

      <!-- CHAT HEADER -->

      <header class="chat-header">

        <div>

          <h1 id="roomName">
            #general
          </h1>

          <span id="roomTopic">
            Realtime chat
          </span>

        </div>


        <div class="header-right">

          <span
            id="connection"
            class="connection offline"
          >
            Connecting…
          </span>


          <button
            id="usersToggle"
            type="button"
          >
            ☷
            <span id="userCount">0</span>
          </button>

        </div>

      </header>


      <!-- ============================= -->
      <!-- MESSAGE LIST -->
      <!-- ============================= -->

      <section
        id="messages"
        class="messages"
        aria-live="polite"
        aria-label="Chat messages"
      ></section>


      <!-- TYPING INDICATOR -->

      <div
        id="typing"
        class="typing"
        aria-live="polite"
      ></div>


      <!-- ============================= -->
      <!-- MESSAGE COMPOSER -->
      <!-- ============================= -->

      <form
        id="composer"
        class="composer"
      >

        <textarea
          id="input"
          rows="1"
          maxlength="2000"
          autocomplete="off"
          placeholder="Message #general — Enter to send, Shift+Enter for a new line"
        ></textarea>


        <button
          type="submit"
          aria-label="Send message"
          title="Send message"
        >
          ➤
        </button>

      </form>

    </main>


    <!-- ============================= -->
    <!-- ONLINE USERS -->
    <!-- ============================= -->

    <aside
      id="userPanel"
      class="user-panel hidden"
    >

      <div class="panel-title">

        ONLINE —
        <span id="panelCount">0</span>

      </div>


      <div
        id="users"
      ></div>

    </aside>

  </div>


  <!-- ============================= -->
  <!-- NICKNAME MODAL -->
  <!-- ============================= -->

  <div
    id="modal"
    class="modal hidden"
  >

    <div class="modal-card">

      <h2>
        Change nickname
      </h2>


      <input
        id="modalInput"
        type="text"
        maxlength="24"
        autocomplete="off"
        placeholder="Nickname"
      >


      <div class="modal-actions">

        <button
          id="modalCancel"
          type="button"
        >
          Cancel
        </button>


        <button
          id="modalOK"
          class="primary"
          type="button"
        >
          OK
        </button>

      </div>

    </div>

  </div>


  <!-- ============================= -->
  <!-- CHAT JAVASCRIPT -->
  <!-- ============================= -->

  <script
    src="script.js"
    defer
  ></script>
  
<!-- Beta Notice -->
<div class="beta-notice">
  Still In Beta Testing
</div>
  
</body>
</html>
